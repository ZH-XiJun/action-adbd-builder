name: adbd Build (Legacy)
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      SOURCE_URL:
        description: 'Android source URL (Usually keep default)'
        required: true
        default: 'https://android.googlesource.com/'
      MANIFEST_BRANCH:
        description: "Source branch (Pls refer to the reference in README.md of the repo)"
        required: true
        default: 'android-7.1.2_r39'
      DEVICE_ARCH:
        description: 'Device architecture'
        required: true
        default: 'arm'
      DEBUG:
        description: 'Give me a shell to customize my adbd'
        required: true
        default: false
        type: boolean
jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Source URL: ${{ github.event.inputs.SOURCE_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Arch: ${{ github.event.inputs.DEVICE_ARCH }}"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev \
            libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev \
            libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev \
            lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python3 ninja-build

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'
        check-latest: false

    - name: Get adb source
      run: git clone ${{ github.event.inputs.SOURCE_URL }}/platform/system/core workspace -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Switch to Python2
      run: |
        sudo add-apt-repository universe -y
        sudo apt update
        sudo apt install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python
      continue-on-error: true

    - name: Tmate SSH - Customize your adbd
      if: ${{ inputs.DEBUG }}
      uses: mxschmitt/action-tmate@v3

    - name: Building adbd
      run: |
        export JAVA_HOME=${{ env.JAVA_HOME }}
        echo "Java version check:"
        java -version
        echo "JAVA_HOME=$JAVA_HOME"
        ls -l $JAVA_HOME/lib/tools.jar
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch aosp_${{ github.event.inputs.DEVICE_ARCH }}-eng
        make clean
        make adbd -j$(nproc --all)
      working-directory: workspace
      continue-on-error: true

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/generic/root/sbin/adbd
          workspace/out/target/product/generic/system/bin/adbd
        name: ${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_ARCH }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Arch: ${{ github.event.inputs.DEVICE_ARCH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
